<html>

<head>
    <title>School Club Website</title>


    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #FF5A43;
        }

        .school-club-cards {
            text-align: center;
            border: 2px solid #FF5A43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff8e1;
        }

        .hobby-card h3 {
            color: #FF5A43;
        }
    </style>
</head>



<body>
    <h1>School Club Website</h1>
    <div class="container">
        <div class="row">

            <!-- STEP 4 -col-12: full width on phones
                
                col-md-6: half width on tablets
                
                col-lg-4: one-third on desktops -->

            <div class="col-12 col-md-6 col-lg-4">
                <div class="school-club-cards">
                    <h3>Science Club</h3>
                    <p>Science club helps to explore science using interesting experiments.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="school-club-cards">
                    <h3>Art Club</h3>
                    <p>Art club helps to paint something beautiful.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="school-club-cards">
                    <h3>Sport Club</h3>
                    <p>Sport club is for playing different sports.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>





















</body>


























</html>
