<html>
    <head>
        <title>Change the color of the text</title>
    </head>


    <body>
        <h2>Change the color of the text</h2>

        <div id="text">Coding means creating software using a specific language that computer can understand.</div>

        <br>

        <button type="button" onclick="ChangeStyle()">Click this button</button>

        <script>
            function ChangeStyle() {
                document.getElementById("text").style.color = "red";
            }


        </script>







    </body>






</html>
